<!DOCTYPE html>
<html>
<head>
    <title>RP Engine</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1484199201662950"
     crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer components {
            .repo-item {
                @apply bg-[#222] p-[10px] rounded-[8px] text-center cursor-pointer border-2 border-transparent transition-[0.2s];
            }
            .repo-item:hover {
                @apply bg-[#2a2a2a] border-[#4a9eff] -translate-y-[2px];
            }
            .repo-item img {
                @apply w-full aspect-square object-cover rounded-[6px] mb-[8px];
            }
            .gold-status {
                border-color: #ffd700 !important;
                box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
            }
            .blue-status {
                border-color: #00ccff !important;
                box-shadow: 0 0 12px rgba(0, 204, 255, 0.3);
            }
        }
    </style>
</head>
<body class="font-['Segoe_UI',system-ui,sans-serif] bg-[#0f0f0f] text-[#e0e0e0] p-[20px] m-0">
<div class="grid grid-cols-3 gap-[20px] max-w-[1400px] mx-auto">
    <div class="bg-[#1a1a1a] p-[20px] rounded-[12px] border border-[#333] shadow-[0_10px_30px_rgba(0,0,0,0.5)] col-span-full">
        <h3 class="mt-0 text-[1.1em] text-[#4a9eff] border-b border-[#333] pb-[10px] mb-[15px] uppercase tracking-[1px]">GitHub Explorer <span id="apiStatus" class="text-[0.8em] text-[#555] ml-auto">--/--</span></h3>
        <div class="bg-[#111] p-[15px] rounded-[8px] border border-[#333] mb-[20px] flex gap-[10px] items-center">
            <input type="password" id="ghToken" placeholder="GitHub Token (PAT)..." class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit flex-[2]">
            <button class="w-auto m-0 p-[12px] cursor-pointer border-none rounded-[6px] font-bold transition-[0.2s] bg-[#444] text-white" onclick="saveToken()">Save</button>
            <a href="https://github.com/settings/tokens/new?description=RP-Engine&scopes=repo" target="_blank" class="text-[#4a9eff] no-underline text-[0.75em] border border-[#4a9eff] p-[4px_8px] rounded-[4px]">Get Token</a>
            <a href="https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens" target="_blank" class="no-underline text-[0.75em] border p-[4px_8px] rounded-[4px] border-[#555] text-[#777]">Token Guide</a>
        </div>
        <div class="flex gap-[10px] mb-[15px]">
            <select id="repoCat" class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit flex-1"><option value="SFW">SFW</option><option value="NSFW">NSFW</option><option value="undereview">Review</option></select>
            <select id="repoType" class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit flex-1"><option value="char">Characters</option><option value="personas">Personas</option></select>
            <input type="text" id="repoSearch" placeholder="Search Folders..." class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit flex-[2]" onkeyup="filterRepo()">
            <button class="w-auto m-0 p-[12px] cursor-pointer border-none rounded-[6px] font-bold transition-[0.2s] bg-[#4a9eff] text-white" onclick="fetchRepo()">Browse</button>
        </div>
        <div id="repoBrowser" class="grid grid-cols-[repeat(auto-fill,minmax(120px,1fr))] gap-[15px] max-h-[350px] overflow-y-auto bg-[#050505] p-[20px] rounded-[8px] border border-[#333]"></div>
    </div>

    <div class="bg-[#1a1a1a] p-[20px] rounded-[12px] border border-[#333] shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
        <h3 class="mt-0 text-[1.1em] text-[#4a9eff] border-b border-[#333] pb-[10px] mb-[15px] uppercase tracking-[1px]">1. Character / Scenario</h3>
        <label class="bg-[#252525] p-[8px] block text-center border border-dashed border-[#444] cursor-pointer rounded-[6px] text-[0.8em] mb-[10px]">Import .char <input type="file" id="importChar" class="hidden"></label>
        <label class="block m-[12px_0_5px] text-[0.75em] text-[#777] font-bold">Character Name</label><input type="text" id="charName" class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit">
        <label class="block m-[12px_0_5px] text-[0.75em] text-[#777] font-bold">Description</label><textarea id="charDesc" class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit h-[75px] resize-y"></textarea>
        <label class="block m-[12px_0_5px] text-[0.75em] text-[#777] font-bold">Scenario</label><textarea id="scenario" class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit h-[75px] resize-y"></textarea>
        <button class="w-full p-[12px] mt-[10px] cursor-pointer border-none rounded-[6px] font-bold transition-[0.2s] bg-[#4a9eff] text-white" onclick="exportFile('char')">Export .char</button>
    </div>

    <div class="bg-[#1a1a1a] p-[20px] rounded-[12px] border border-[#333] shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
        <h3 class="mt-0 text-[1.1em] text-[#4a9eff] border-b border-[#333] pb-[10px] mb-[15px] uppercase tracking-[1px]">2. Your Persona <input type="checkbox" id="usePersona" checked class="w-auto float-right p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit"></h3>
        <label class="bg-[#252525] p-[8px] block text-center border border-dashed border-[#444] cursor-pointer rounded-[6px] text-[0.8em] mb-[10px]">Import .persona <input type="file" id="importPers" class="hidden"></label>
        <label class="block m-[12px_0_5px] text-[0.75em] text-[#777] font-bold">Your Name</label><input type="text" id="yourName" value="User" class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit">
        <label class="block m-[12px_0_5px] text-[0.75em] text-[#777] font-bold">Description</label><textarea id="yourDesc" class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit h-[75px] resize-y"></textarea>
        <button class="w-full p-[12px] mt-[10px] cursor-pointer border-none rounded-[6px] font-bold transition-[0.2s] bg-[#9b59b6] text-white" onclick="exportFile('persona')">Export .persona</button>
    </div>

    <div class="bg-[#1a1a1a] p-[20px] rounded-[12px] border border-[#333] shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
        <h3 class="mt-0 text-[1.1em] text-[#4a9eff] border-b border-[#333] pb-[10px] mb-[15px] uppercase tracking-[1px]">3. Author File Creator</h3>
        <label class="bg-[#252525] p-[8px] block text-center border border-dashed border-[#444] cursor-pointer rounded-[6px] text-[0.8em] mb-[10px]">Import .author <input type="file" id="importAuth" class="hidden"></label>
        <label class="block m-[12px_0_5px] text-[0.75em] text-[#777] font-bold">Creator Name</label><input type="text" id="authName" placeholder="e.g. AIRPGITHUB team" class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit">
        <label class="block m-[12px_0_5px] text-[0.75em] text-[#777] font-bold">Creator Notes</label><textarea id="authNotes" placeholder="Links or versioning info..." class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit h-[75px] resize-y"></textarea>
        <div id="authorMeta" class="mt-[20px] p-[12px] bg-[#111] rounded-[6px] text-[0.8em]">
            Loaded: <span id="authFileName" class="text-[#2ecc71]">None</span>
        </div>
        <button class="w-full p-[12px] mt-[10px] cursor-pointer border-none rounded-[6px] font-bold transition-[0.2s] bg-[#2ecc71] text-white" onclick="exportFile('author')">Export .author</button>
    </div>

<div id="tags" class="bg-[#1a1a1a] p-[20px] rounded-[12px] border border-[#333] shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
    <h3 class="mt-0 text-[1.1em] text-[#4a9eff] border-b border-[#333] pb-[10px] mb-[15px] uppercase tracking-[1px]">RP Tags & Formatting</h3>
    <div class="flex items-center justify-between mb-3">
        <label class="text-[0.75em] text-[#777] font-bold uppercase tracking-wide">Allow Mature Themes?</label>
        <input type="checkbox" id="mc" class="w-4 h-4 accent-[#4a9eff]" onchange="update()">
    </div>
    <div class="flex items-center justify-between mb-4">
        <label class="text-[0.75em] text-[#777] font-bold uppercase tracking-wide">Enable Research?</label>
        <input type="checkbox" id="rc" class="w-4 h-4 accent-[#4a9eff]" onchange="update()">
    </div>
    <label class="block m-[12px_0_5px] text-[0.75em] text-[#777] font-bold uppercase tracking-wide">Formatting Options</label>
    <select name="formating" id="formating" class="w-full p-[10px] bg-black border border-[#444] text-white rounded-[6px] box-border font-inherit" onchange="update()">
        <option>Plain text</option>
        <option>Markdown</option>
        <option>Markdown + Latex</option>
    </select>
</div>

    <div class="bg-[#1a1a1a] p-[20px] rounded-[12px] border border-[#333] shadow-[0_10px_30px_rgba(0,0,0,0.5)] col-span-full">
        <h3 class="mt-0 text-[1.1em] text-[#4a9eff] border-b border-[#333] pb-[10px] mb-[15px] uppercase tracking-[1px]">Final RP Output</h3>
        <textarea id="finalOutput" class="w-full p-[10px] rounded-[6px] box-border resize-y bg-black text-[#00ff00] font-['Consolas',monospace] h-[100px] border border-[#222] mt-[10px]" readonly></textarea>
        <button class="w-full p-[12px] mt-[10px] cursor-pointer border-none rounded-[6px] font-bold transition-[0.2s] bg-[#f1c40f] text-[#000] text-[1.1em]" onclick="copyResult()">COPY FOR RP</button>
    </div>
</div>

<button href="kellentv.github.io/AIRPGITHUB/P2P">Try out beta</button>
    
<script>
    const GITHUB_USER = "kellenTV";
    const GITHUB_REPO = "AIRPGITHUB";

    function getHeaders() {
        const t = localStorage.getItem('rp_token');
        const h = { 'Accept': 'application/vnd.github.v3+json' };
        if (t) h['Authorization'] = `token ${t.trim()}`;
        return h;
    }

    function saveToken() {
        localStorage.setItem('rp_token', document.getElementById('ghToken').value);
        checkLimit(); alert("Token Saved.");
    }

    async function checkLimit() {
        try {
            const res = await fetch("https://api.github.com/rate_limit", { headers: getHeaders() });
            const d = await res.json();
            document.getElementById('apiStatus').innerText = `${d.resources.core.remaining}/${d.resources.core.limit}`;
        } catch(e){}
    }

    async function fetchRepo() {
        const cat = document.getElementById('repoCat').value;
        const type = document.getElementById('repoType').value;
        const browser = document.getElementById('repoBrowser');
        browser.innerHTML = "Scanning Repo...";
        checkLimit();

        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${cat}/${type}`, { headers: getHeaders() });
            const items = await res.json();
            browser.innerHTML = "";

            for (const f of items.filter(i => i.type === 'dir')) {
                const div = document.createElement('div');
                div.className = 'repo-item';
                div.setAttribute('data-name', f.name.toLowerCase());
                div.innerHTML = `<div style="width:100%; aspect-ratio:1/1; background:#111; border-radius:6px;"></div><span>${f.name}</span>`;
                browser.appendChild(div);

                fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${f.path}`, { headers: getHeaders() })
                    .then(r => r.json()).then(async files => {
                        const img = files.find(x => x.name.match(/\.(png|jpg|webp|jpeg)$/i));
                        const authFile = files.find(x => x.name.endsWith('.author') || x.name === 'creator.author');
                        
                        if (authFile && cat !== 'undereview') {
                            try {
                                const aRes = await fetch(authFile.url, { headers: { ...getHeaders(), 'Accept': 'application/vnd.github.v3.raw' } });
                                const aData = JSON.parse((await aRes.text()).replace(/,[ \t\r\n]*}/g, '}'));
                                if (aData.original === true) div.classList.add('gold-status');
                                else if (aData.verified === true) div.classList.add('blue-status');
                            } catch(e) {}
                        }
                        div.innerHTML = (img ? `<img src="${img.download_url}">` : `<div></div>`) + `<span>${f.name}</span>`;
                        div.onclick = () => loadData(files, type, f.name);
                    });
            }
        } catch(e) { browser.innerHTML = "Error loading. Check Token."; }
    }

    async function loadData(files, type, folderName) {
        const dataFile = files.find(f => f.name.match(/\.(char|persona|json)$/i));
        const authorFile = files.find(f => f.name.endsWith('.author') || f.name === 'creator.author');

        if (authorFile) {
            const aRes = await fetch(authorFile.url, { headers: { ...getHeaders(), 'Accept': 'application/vnd.github.v3.raw' } });
            const aData = JSON.parse((await aRes.text()).replace(/,[ \t\r\n]*}/g, '}'));
            document.getElementById('authName').value = aData.author || aData.name || "";
            document.getElementById('authNotes').value = aData.notes || "";
            document.getElementById('authFileName').innerText = authorFile.name;
        } else {
            document.getElementById('authName').value = "";
            document.getElementById('authNotes').value = "";
            document.getElementById('authFileName').innerText = "None (Required)";
        }

        if (!dataFile) return;
        const res = await fetch(dataFile.url, { headers: { ...getHeaders(), 'Accept': 'application/vnd.github.v3.raw' } });
        const d = JSON.parse((await res.text()).replace(/,[ \t\r\n]*}/g, '}'));
        
        if (type === 'personas') {
            document.getElementById('yourName').value = d.name || folderName;
            document.getElementById('yourDesc').value = d.description || "";
        } else {
            document.getElementById('charName').value = d.name || folderName;
            document.getElementById('charDesc').value = d.description || "";
            document.getElementById('scenario').value = d.scenario || "";
        }
        update();
    }

    function update() {
        const cN = document.getElementById('charName').value;
        const cD = document.getElementById('charDesc').value;
        const s = document.getElementById('scenario').value;
        const pN = document.getElementById('yourName').value;
        const pD = document.getElementById('yourDesc').value;
        const useP = document.getElementById('usePersona').checked;
        const isMature = document.getElementById('mc').checked;
        const isResearch = document.getElementById('rc').checked;
        const format = document.getElementById('formating').value;
        
        let str = `You are ${cN || 'the character'}. `;
        if (cD.trim()) str += `${cD}. `;
        if (s.trim()) str += `Scenario: ${s}. `;
        if (useP) str += `\n \n \n I am ${pN} ${pD}`; // FIXED useP() error
        if (isMature) str += `\n*CA*`;
        if (isResearch) str += `\n*RA*`;
        if (format === "Markdown") str += `\nmd`;
        else if (format === "Markdown + Latex") str += `\nmd2`;
        
        document.getElementById('finalOutput').value = str.trim();
    }

    function exportFile(type) {
        let data, name;
        if (type === 'char') {
            data = { name: document.getElementById('charName').value, description: document.getElementById('charDesc').value, scenario: document.getElementById('scenario').value };
            name = (data.name || "char") + ".char";
        } else if (type === 'persona') {
            data = { name: document.getElementById('yourName').value, description: document.getElementById('yourDesc').value };
            name = (data.name || "user") + ".persona";
        } else {
            data = { author: document.getElementById('authName').value, notes: document.getElementById('authNotes').value };
            name = "creator.author";
        }
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = name; a.click();
    }

    function handleFile(e, targetId1, targetId2, targetId3) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const d = JSON.parse(e.target.result);
            if (targetId1) document.getElementById(targetId1).value = d.name || d.author || "";
            if (targetId2) document.getElementById(targetId2).value = d.description || d.notes || "";
            if (targetId3) document.getElementById(targetId3).value = d.scenario || "";
            update();
        };
        reader.readAsText(file);
    }

    document.getElementById('importChar').addEventListener('change', (e) => handleFile(e, 'charName', 'charDesc', 'scenario'));
    document.getElementById('importPers').addEventListener('change', (e) => handleFile(e, 'yourName', 'yourDesc'));
    document.getElementById('importAuth').addEventListener('change', (e) => {
        handleFile(e, 'authName', 'authNotes');
        document.getElementById('authFileName').innerText = e.target.files[0].name;
    });

    function filterRepo() {
        const q = document.getElementById('repoSearch').value.toLowerCase();
        document.querySelectorAll('.repo-item').forEach(i => {
            i.style.display = i.innerText.toLowerCase().includes(q) ? 'block' : 'none';
        });
    }

    function copyResult() {
        document.getElementById('finalOutput').select(); document.execCommand('copy');
    }

    document.querySelectorAll('input, textarea').forEach(el => el.addEventListener('input', update));
    document.getElementById('usePersona').addEventListener('change', update);
    document.getElementById('ghToken').value = localStorage.getItem('rp_token') || "";
    checkLimit(); update();
</script>
</body>
</html>
